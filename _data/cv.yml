cv:
  name: Navid Reyhanian
  label: Wireless Systems Architect, Ph.D.
  email: navid.reyhanian@gmail.com
  website: https://navidreyhanian.github.io
  summary: >
    Signal processing expert specializing in digital/analog precoding and optimization for next-generation wireless systems.
    Designed algorithms for multi-user MIMO-OFDM, satellite-terrestrial, and RIS-assisted architectures, and developed localization
    solutions using GNSS, Wi-Fi FTM, BLE, UWB, and AoA/PDoA. Hands-on in debugging code and systems to solve real-world problems.

  sections:
    Experience:
      - company: Cisco Systems, Inc., Enterprise Networking Product Group
        position: Wireless Systems Architect
        location: Milpitas, CA
        start_date: 2022-06
        summary: Advanced development of signal processing algorithms for wireless networks. Code developed and maintained in C/C++ and Python.
        highlights:
          - Designed and developed a GNSS receiver combining a Kalman filter with raw pseudorange measurements and Gauss-Newton optimization for more accurate, robust positioning.
          - Created algorithms for real-time localization of access points that jointly process Wi-Fi Fine Time Measurement (FTM) data and GNSS signals.
          - Developed an Angle of Arrival (AoA) estimation framework from Phase Difference of Arrival (PDoA) measurements on AP antennas, with phase unwrapping, memory, and ambiguity resolution.
          - Analyzed RF impairments of transmit front-end modules, including filtering, tuning, and adaptive power control, to meet FTM ranging accuracy requirements.
          - Designed clustering algorithms for AP grouping and a UWB client positioning engine for downlink TDoA networks.
          - Led the design and development of an uplink TDoA tag positioning system.
          - Developed block coordinate descent algorithms for large-scale, rank-constrained anchor-free optimization, improving AP localization in GPS-denied environments.
          - Hands-on performance testing of Wi-Fi, BLE, and UWB devices, plus debugging and performance tuning of C/C++ and Python code with tight latency requirements.

      - company: Sabre Corporation
        position: Operations Research Analyst (Intern)
        location: Southlake, TX
        start_date: 2019-05
        end_date: 2019-08
        summary: Distributed, scalable large-scale optimization algorithms for airline scheduling.
        highlights:
          - ADMM with warm start, with linearized subproblems solved by away-steps Frank-Wolfe.

